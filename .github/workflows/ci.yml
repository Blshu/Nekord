name: Nekord CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  check-and-lint:
    name: Check Code & Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Create Frontend Dummy Asset for Go Embed
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/index.html

      - name: Verify Go Modules
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Go Vet & Build Check
        run: |
          go vet ./...
          go build -v ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Plugins JS Syntax
        run: |
          echo "Checking JavaScript syntax in ./plugins..."
          find ./plugins -name "*.js" -exec node --check {} +
          echo "All plugins syntax verified! 🐾"